name: RaceDay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Find and Build Projects
      run: |
        echo "=== Looking for solution file ==="
        find . -name "*.sln"
        echo "=== Building API ==="
        dotnet build $(find . -name "RaceDay.API.csproj") --configuration Release
        echo "=== Building MVC ==="
        dotnet build $(find . -name "RaceDay.MVC.csproj") --configuration Release
        echo "=== Running Tests ==="
        dotnet test $(find . -name "RaceDay.API.Tests.csproj") --configuration Release