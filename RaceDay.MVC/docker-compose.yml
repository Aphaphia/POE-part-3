version: '3.8'

services:
  raceday-api:
    image: raceday-api
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    ports:
      - "7201:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=RaceDayDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__AzureStorage=UseDevelopmentStorage=true
    depends_on:
      - db

  raceday-mvc:
    image: raceday-mvc
    build:
      context: .
      dockerfile: RaceDay.MVC/Dockerfile
    ports:
      - "7219:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://raceday-api:8080
    depends_on:
      - raceday-api

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"